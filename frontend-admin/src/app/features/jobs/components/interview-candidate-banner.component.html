<div class="candidate-banner">
  <div class="banner-left">
    <div class="avatar-circle">{{ getInitials(data()!.candidate.name) }}</div>
    <div>
      <span class="banner-eyebrow">ỨNG VIÊN ĐANG PHỎNG VẤN</span>
      <h3 class="candidate-name">{{ data()!.candidate.name }}</h3>
      <strong class="candidate-role">{{ data()!.job_title }}</strong>
      <div class="candidate-meta">
        <span>{{ data()!.candidate.email }}</span>
        @if (data()!.candidate.phone) {
          <span>{{ data()!.candidate.phone }}</span>
        }
      </div>
    </div>
  </div>
  <div class="banner-right">
    <span class="interview-status"><i></i>Đang phỏng vấn</span>
    <button nz-button (click)="closeRoom()">Thoát phòng</button>
  </div>
</div>
