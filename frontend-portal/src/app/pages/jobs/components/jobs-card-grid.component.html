<div class="jobs-cards-grid">
  @for (job of paginatedJobs; track job.id) {
    <article
      class="job-card-item"
      [class.is-applied]="job.isApplied"
      (click)="navigateToJob(job)"
    >
      <header class="card-header-row">
        <h3 class="job-card-title" [title]="job.title">
          <a [routerLink]="['/jobs', job.slug]" (click)="$event.stopPropagation()">{{ job.title }}</a>
        </h3>
        <button
          type="button"
          class="bookmark-btn"
          [class.saved]="job.isSaved"
          (click)="toggleSaveJob($event, job)"
          nz-tooltip
          [nzTooltipTitle]="job.isSaved ? 'Bỏ lưu việc làm' : 'Lưu việc làm'"
          aria-label="Lưu việc làm"
        >
          <span nz-icon nzType="heart" [nzTheme]="job.isSaved ? 'fill' : 'outline'"></span>
        </button>
      </header>

      <div class="card-badges-row">
        <strong class="salary-pill-badge irsa-mono">{{ job.salaryFormatted || 'Thỏa thuận' }}</strong>
        @if (job.isApplied) {
          <span class="applied-status">Đã ứng tuyển</span>
        }
      </div>

      <dl class="card-meta-grid">
        <div class="meta-item">
          <dt>Địa điểm</dt>
          <dd>{{ job.location }}</dd>
        </div>
        <div class="meta-item">
          <dt>Hình thức</dt>
          <dd>{{ job.type }}</dd>
        </div>
        <div class="meta-item">
          <dt>Kinh nghiệm</dt>
          <dd>{{ job.experience }}</dd>
        </div>
      </dl>

      <footer class="card-footer-row">
        <div class="deadline-block">
          <span>Hạn nộp</span>
          <strong>{{ job.deadlineDate || 'Chưa cập nhật' }}</strong>
        </div>

        <div class="card-action-buttons">
          <button type="button" class="quick-view-btn" (click)="openQuickPreview($event, job)">Xem nhanh</button>
          <a [routerLink]="['/jobs', job.slug]" (click)="$event.stopPropagation()" class="card-primary-cta">Chi tiết</a>
        </div>
      </footer>
    </article>
  }
</div>
