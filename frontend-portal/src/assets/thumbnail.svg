<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071226"/>
      <stop offset="100%" stop-color="#0C1C38"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F52BA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F52BA" flood-opacity="0.3"/>
    </filter>
    <radialGradient id="glowLeft" cx="20%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#0F52BA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0F52BA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glowLeft)"/>
  <rect width="1200" height="630" fill="url(#glowRight)"/>

  <!-- Tech Grid Background -->
  <g stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.04">
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>

  <!-- Left: Logo Squircle Card -->
  <g transform="translate(108, 139)" filter="url(#cardShadow)">
    <rect width="352" height="352" rx="78" fill="url(#cardGrad)"/>
    <rect x="2" y="2" width="348" height="348" rx="76" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.4"/>
    <g transform="translate(176, 176) scale(0.26) translate(-512, -510)" fill="#FFFFFF">
      <path d="M848 359.3H627.7L825.8 109c4.1-5.3.4-13-6.3-13H436c-2.8 0-5.5 1.5-6.9 4L170 547.5c-3.1 5.3.7 12 6.9 12h174.4l-89.4 357.6c-1.9 7.8 7.5 13.3 13.3 7.7L853.5 373c5.2-4.9 1.7-13.7-5.5-13.7z"/>
    </g>
  </g>

  <!-- Right: Content -->
  <g transform="translate(520, 160)">
    <!-- Badge -->
    <rect width="320" height="40" rx="20" fill="#2563EB" fill-opacity="0.25" stroke="#93C5FD" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="20" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#BFDBFE" letter-spacing="1">⚡ AI-POWERED TALENT PLATFORM</text>

    <!-- Title -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="800" fill="#FFFFFF" letter-spacing="-1">iRSA</text>

    <!-- Subtitle -->
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#F1F5F9">Cổng Thông Tin Tuyển Dụng &amp; Việc Làm</text>

    <!-- Description -->
    <text x="0" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94A3B8">Nền tảng kết nối ứng viên tài năng và doanh nghiệp thông minh</text>

    <!-- Tags -->
    <g transform="translate(0, 260)">
      <g transform="translate(0, 0)">
        <rect width="180" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15"/>
        <text x="16" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#E2E8F0">Tìm việc thông minh</text>
      </g>
      <g transform="translate(192, 0)">
        <rect width="150" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15"/>
        <text x="16" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#E2E8F0">Phân tích CV AI</text>
      </g>
      <g transform="translate(354, 0)">
        <rect width="140" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15"/>
        <text x="16" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#E2E8F0">Kết nối tức thì</text>
      </g>
    </g>
  </g>
</svg>
